name: ci

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings

jobs:
  check:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.88.0
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets --locked
      # The image's default user is a superuser, which bypasses row-level
      # security. Tests must run as an unprivileged role to mean anything.
      - name: Create unprivileged test role
        env:
          PGPASSWORD: postgres
        run: |
          psql -h localhost -U postgres -v ON_ERROR_STOP=1 \
            -c "CREATE ROLE axon_test LOGIN PASSWORD 'axon'" \
            -c "CREATE DATABASE axon_test OWNER axon_test"
      - run: cargo test --workspace --locked
        env:
          AXON_TEST_DATABASE_URL: postgres://axon_test:axon@localhost:5432/axon_test
